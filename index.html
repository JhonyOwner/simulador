<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Acesso controlado ao simulador de consórcio.">
<title>Simulador de Consórcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--ink-2:#27231D;--parchment:#F4EEDD;--gold:#B98A2E;--gold-light:#D9AE5D;--muted:#93a3b0;--sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--serif:'Fraunces',serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(circle at 50% 0,rgba(217,174,93,.13),transparent 42%),linear-gradient(180deg,#101010,#27231D);font-family:var(--sans);color:var(--parchment)}
.card{width:min(100%,620px);padding:36px 40px;background:linear-gradient(180deg,#171717,#28231D);border:1px solid rgba(217,174,93,.24);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.eyebrow{margin-bottom:16px;color:var(--gold-light);font:12px var(--mono);letter-spacing:.16em;text-transform:uppercase}.eyebrow:before{content:'';display:inline-block;width:24px;height:1px;margin:0 9px 4px 0;background:var(--gold-light)}
h1{margin:0 0 10px;font:600 clamp(27px,5vw,38px)/1.1 var(--serif)}.lede{margin:0 0 24px;color:#C9D2DB;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:18px;border-bottom:1px solid rgba(217,174,93,.2)}.tab{padding:12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:600 12px var(--mono);cursor:pointer}.tab.active{border-bottom-color:var(--gold);color:var(--gold-light)}
.auth-form{display:grid;gap:13px}.auth-form label{display:grid;gap:6px;color:#C9D2DB;font-size:13px}.auth-form input,.admin-box input{width:100%;padding:12px 13px;border:1px solid rgba(217,174,93,.3);border-radius:6px;background:rgba(255,255,255,.07);color:#fff;font:15px var(--mono);outline:0}.auth-form input:focus,.admin-box input:focus{border-color:var(--gold-light);box-shadow:0 0 0 3px rgba(217,174,93,.13)}small{color:var(--muted);font-size:11px}.btn{width:100%;padding:12px 16px;border:0;border-radius:7px;cursor:pointer;font:600 13px var(--mono)}.btn-primary{background:var(--gold);color:var(--ink);box-shadow:0 7px 18px rgba(185,138,46,.2)}.btn-secondary{width:auto;margin-top:8px;border:1px solid rgba(217,174,93,.4);background:transparent;color:var(--gold-light)}.password-wrap{position:relative}.password-wrap input{padding-right:44px}.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--gold-light);cursor:pointer;width:32px;height:32px;display:grid;place-items:center;padding:0}.toggle-password svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hidden{display:none}.notice{display:none;margin:0 0 15px;padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.45}.notice.success{display:block;background:rgba(55,132,94,.18);color:#B8E4C8;border:1px solid rgba(120,210,151,.28)}.notice.error{display:block;background:rgba(180,67,61,.18);color:#F2C1BC;border:1px solid rgba(230,117,105,.28)}
.admin-box{margin-top:26px;padding-top:16px;border-top:1px solid rgba(217,174,93,.18);color:#C9D2DB}.admin-box summary{cursor:pointer;color:var(--gold-light);font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase}.admin-box p{font-size:12px}.user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(217,174,93,.13);font-size:12px}.user-row span{display:grid;gap:3px}.user-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.user-row button{border:1px solid rgba(217,174,93,.35);border-radius:5px;padding:5px 8px;background:transparent;color:var(--gold-light);font:11px var(--mono);cursor:pointer}.disclaimer{margin:24px 0 0;padding-top:16px;border-top:1px solid rgba(217,174,93,.16);color:var(--muted);font-size:11px;line-height:1.5}
@media(max-width:520px){.card{padding:28px 20px}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Acesso controlado</div>
  <h1>Simulador de Consórcio</h1>
  <p class="lede">Entre com uma conta autorizada. Novos cadastros passam por aprovação antes do acesso.</p>
  <div class="tabs"><button class="tab active" data-target="loginPanel">Entrar</button><button class="tab" data-target="registerPanel">Solicitar acesso</button></div>
  <div id="notice" class="notice" role="status"></div>
  <form id="loginPanel" class="auth-form">
    <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label>Senha<div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required><button class="toggle-password" type="button" aria-label="Mostrar senha" title="Mostrar senha"></button></div></label>
    <button class="btn btn-primary" type="submit">Entrar no simulador</button>
  </form>
  <form id="registerPanel" class="auth-form hidden">
    <label>Nome completo<input name="name" autocomplete="name" minlength="3" required></label>
    <label>CPF<input name="cpf" data-mask="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></label>
    <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label>Telefone<input name="phone" data-mask="phone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" required></label>
    <label>Senha<div class="password-wrap"><input name="password" type="password" minlength="8" autocomplete="new-password" required><button class="toggle-password" type="button" aria-label="Mostrar senha" title="Mostrar senha"></button></div><small>Use ao menos 8 caracteres, com letra e número.</small></label>
    <button class="btn btn-primary" type="submit">Enviar solicitação</button>
  </form>
  <details class="admin-box"><summary>Gestão de acessos</summary><p>Área restrita para aprovação de usuários selecionados.</p><div class="password-wrap"><input id="adminKey" type="password" placeholder="Chave administrativa"><button class="toggle-password" type="button" aria-label="Mostrar chave" title="Mostrar chave"></button></div><button id="loadUsers" class="btn btn-secondary" type="button">Carregar cadastros</button><div id="usersList"></div></details>
  <p class="disclaimer">Os dados são usados somente para controle de acesso. Nunca compartilhe sua senha.</p>
</main>
<script>
const eyeOpen='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>';
const eyeClosed='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.8M6.2 6.8C3.5 8.7 2 12 2 12s3.5 6 10 6a10.5 10.5 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
document.querySelectorAll('.toggle-password').forEach(button=>{const input=button.parentElement.querySelector('input');button.innerHTML=eyeOpen;button.addEventListener('click',()=>{const visible=input.type==='text';input.type=visible?'password':'text';button.innerHTML=visible?eyeOpen:eyeClosed;button.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha');button.title=visible?'Mostrar senha':'Ocultar senha'})});
const notice=document.getElementById('notice');
function showNotice(message,error=false){notice.textContent=message;notice.className=`notice ${error?'error':'success'}`}
function mask(value,type){const numbers=value.replace(/\D/g,'');if(type==='cpf')return numbers.slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');return numbers.slice(0,11).replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2')}
document.querySelectorAll('[data-mask]').forEach(input=>input.addEventListener('input',()=>input.value=mask(input.value,input.dataset.mask)));
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('.auth-form').forEach(form=>form.classList.toggle('hidden',form.id!==tab.dataset.target));notice.className='notice'}));
async function readResponse(response){const text=await response.text();try{return JSON.parse(text)}catch{return {message:response.ok?'Resposta inválida do servidor.':'Servidor indisponível ou configuração incompleta na Vercel.'}}}
async function submitForm(form,url){const data=Object.fromEntries(new FormData(form));const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const result=await readResponse(response);if(!response.ok)throw new Error(Object.values(result.errors||{})[0]||result.message||'Não foi possível concluir.');return result}
document.getElementById('loginPanel').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;try{await submitForm(form,'/api/login');location.href='/simulador'}catch(error){showNotice(error.message,true)}});
document.getElementById('registerPanel').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;try{const result=await submitForm(form,'/api/register');form.reset();showNotice(result.message)}catch(error){showNotice(error.message,true)}});
document.getElementById('loadUsers').addEventListener('click',async()=>{try{const key=document.getElementById('adminKey').value;const response=await fetch('/api/admin/users',{headers:{'x-admin-key':key}});const result=await readResponse(response);if(!response.ok)throw new Error(result.message);document.getElementById('usersList').innerHTML=result.users.map(user=>`<div class="user-row"><span>${user.name}<small>${user.email}<br>${user.device_id?'🔒 Dispositivo vinculado':'⚪ Sem dispositivo'}${user.last_login_at?` • Último acesso: ${new Date(user.last_login_at).toLocaleString('pt-BR')}`:''}</small></span><span class="user-actions"><button type="button" data-id="${user.id}" data-approved="${!user.approved}">${user.approved?'Bloquear':'Aprovar'}</button>${user.device_id?`<button type="button" data-reset-id="${user.id}">Liberar aparelho</button>`:''}</span></div>`).join('')||'<small>Nenhum cadastro.</small>';document.querySelectorAll('.user-row button[data-approved]').forEach(button=>button.addEventListener('click',async()=>{await fetch('/api/admin/approval',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({id:button.dataset.id,approved:button.dataset.approved==='true'})});document.getElementById('loadUsers').click()}));document.querySelectorAll('.user-row button[data-reset-id]').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('Liberar o dispositivo deste usuário? O próximo aparelho usado no login será vinculado à conta.'))return;await fetch('/api/admin/device-reset',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({id:button.dataset.resetId})});document.getElementById('loadUsers').click()}))}catch(error){showNotice(error.message,true)}});
fetch('/api/session').then(readResponse).then(result=>{if(result.user)location.href='/simulador'});
</script>
</body>
</html>
